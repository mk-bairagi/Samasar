    base: "https://www.amarujala.com/rss/{slug}.xml"
    lang: hi
    scope: district
    state: mp
    slugs: [agar-malwa, anuppur, ashoknagar, balaghat, barwani, betul, bhind, bhopal,
            burhanpur, chhatarpur, chhindwara, damoh, datia, dewas, dhar, dindori, guna,
            gwalior, harda, indore, jabalpur, jhabua, katni, khandwa, khargone, mandla,
            mandsaur, morena, narmadapuram, narsinghpur, neemuch, panna, raisen, rajgarh,
            ratlam, rewa, sagar, satna, sehore, seoni, shahdol, shajapur, sheopur,
            shivpuri, sidhi, singrauli, tikamgarh, ujjain, umaria, vidisha]

  - id_prefix: au_up
    name: "अमर उजाला"
    base: "https://www.amarujala.com/rss/{slug}.xml"
    lang: hi
    scope: district
    state: up
    slugs: [agra, aligarh, allahabad, ambedkar-nagar, amethi, amroha, auraiya, ayodhya,
            azamgarh, baghpat, bahraich, ballia, balrampur, banda, barabanki, bareilly,
            basti, bijnor, budaun, bulandshahr, chandauli, chitrakoot, deoria, etah,
            etawah, farrukhabad, fatehpur, firozabad, noida, ghaziabad, ghazipur, gonda,
            gorakhpur, hamirpur, hapur, hardoi, hathras, jalaun, jaunpur, jhansi, kannauj,
            kanpur, kasganj, kaushambi, kushinagar, lakhimpur-kheri, lalitpur, lucknow,
            maharajganj, mahoba, mainpuri, mathura, mau, meerut, mirzapur, moradabad,
            muzaffarnagar, pilibhit, pratapgarh, raebareli, rampur, saharanpur, sambhal,
            sant-kabir-nagar, shahjahanpur, shamli, shravasti, siddharthnagar, sitapur,
            sultanpur, unnao, varanasi]

  # Gujarat has no district-level RSS anywhere we could find. Divya Bhaskar
  # publishes topic categories only, and Patrika covers just these two cities —
  # Rajkot, Vadodara, Gandhinagar, Jamnagar, Bhavnagar and Junagadh all return
  # empty. So Gujarat ships state-level; the Scout job hunts for local outlets.
  - id_prefix: patrika_gj
    name: "પત્રિકા"
    base: "https://cms.patrika.com/googlefeed/blog/location/{slug}-news"
    lang: gu
    scope: district
    state: gj
    slugs: [ahmedabad, surat]

  # Patrika serves a location feed for every MP district, not just the big five.
  # This is the second source small districts badly need: Amar Ujala's Neemuch
  # feed holds 40 items spanning four months, so on any given week it offers one
  # story. Patrika adds 20 more, refreshed far more often.
  - id_prefix: patrika_mp
    name: "पत्रिका"
    base: "https://cms.patrika.com/googlefeed/blog/location/{slug}-news"
    lang: hi
    scope: district
    state: mp
    slugs: [agar-malwa, anuppur, ashoknagar, balaghat, barwani, betul, bhind, bhopal,
            burhanpur, chhatarpur, chhindwara, damoh, datia, dewas, dhar, dindori, guna,
            gwalior, harda, indore, jabalpur, jhabua, katni, khandwa, khargone, mandla,
            mandsaur, morena, narmadapuram, narsinghpur, neemuch, panna, raisen, rajgarh,
            ratlam, rewa, sagar, satna, sehore, seoni, shahdol, shajapur, sheopur,
            shivpuri, sidhi, singrauli, tikamgarh, ujjain, umaria, vidisha]

# Publishers with no feed at all, read from their listing page instead.
#
# Only for sources worth the fragility. Neemuch is the thinnest district in the
# app — Amar Ujala's feed there holds 40 items spanning four months — and Neemuch
# Today publishes genuinely local reporting daily. Their robots.txt states
# `Allow: /` with `Content-Signal: search=yes, use=reference`, which is exactly
# what this does: headline, link, attribution, and the reader sent to them.
# robots.txt is re-checked on every run and a refusal skips the source.
scrapers:
  - id: neemuchtoday
    name: "नीमच टुडे"
    url: "https://neemuchtodaynews.com"
    lang: hi
    scope: district
    state: mp
    district: neemuch
    link_pattern: "/singlepage/[0-9]+"
    image_pattern: "/assets/news/"
    date_selector: "span.date"
    strip_suffixes: ["@NeemuchToday"]
    min_title_length: 15

# Kept so nobody re-adds these by guesswork. Checked 2026-08-13.
known_bad:
  - { id: jagran,          reason: "guessed RSS paths 404; articles appear via GDELT, so feed URL needs discovery" }
  - { id: naidunia,        reason: "no RSS discoverable; major Indore daily — candidate for HTML extraction" }
  - { id: navbharattimes,  reason: "rssfeedstopstories.cms 404 on the hindi subdomain" }
  - { id: zeenews_hindi,   reason: "403 even with a browser UA" }
  - { id: zee24kalak,      reason: "403 even with a browser UA" }
  - { id: scroll,          reason: "200 but zero items" }
  - { id: thewire,         reason: "200 but zero items" }
  - { id: theprint,        reason: "200 but zero items" }
  - { id: firstpost,       reason: "200 but zero items" }
  - { id: deccanherald,    reason: "404 — feed path changed" }
  - { id: sandesh,         reason: "200 but zero items (Gujarati)" }
  - { id: gujaratsamachar, reason: "404 (Gujarati)" }
  - { id: apnaneemuch,     reason: "app-only publisher (Play: com.STS.ApnaNeemuch); the website is a 215-byte landing page. No feed and no web content — the only route would be their app's private API, which is not ours to use. Contact: apnaneemuch@gmail.com" }
