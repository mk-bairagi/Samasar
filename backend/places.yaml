# Slug → display name.
#
# Feed slugs are whatever the publisher happened to use, which is not always what
# the place is called. Amar Ujala still serves Prayagraj at /rss/allahabad.xml —
# the city was renamed in 2018. Showing "Allahabad" to a Prayagraj reader, or
# failing to match a search for "Prayagraj", is exactly the kind of detail that
# makes a local app feel foreign. `aliases` feeds the search index so both names
# resolve.

